<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SAIL BSP Portal{% endblock %}</title>    
    {% load static %}
    <link rel="stylesheet" href="{% static 'bsp/bsp.css' %}">
    {% block headcontent %}{% endblock %}
</head>
<body>
    {% include "bsp/includes/messages.html" %}
    <div id="header" class="header">
        <div class="header-left">
            <div class="header-element">
                <a href="{% url 'bsp:home' %}">
                    <img id="home-btn" src="{% static 'bsp/images/bsp_logo.png' %}" alt="SAIL BSP" style="height: 36px; vertical-align: middle;">
                </a>
            </div>
        </div>
        <div class="header-right">
            <div class="header-element">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="link-button" id="logout-btn">Logout</button>
                </form>
            </div>
        </div>
    </div>

    <div class="content-body">
        {% block content %}{% endblock %}
    </div>

    {% block js %}
    <script src="{% static 'bsp/js/script.js' %}"></script>
    {% endblock %}
</body>
</html>
