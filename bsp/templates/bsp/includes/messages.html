{% if messages %}
<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; max-width: 420px; width: calc(100% - 40px); pointer-events: none;">
    {% for message in messages %}
    <div class="toast-item toast-{{ message.tags }}" style="pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-radius: 8px; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.92rem; font-weight: 500; box-shadow: 0 6px 18px rgba(0,0,0,0.35); animation: toastSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        {% if message.tags == 'success' %}background: linear-gradient(135deg, #1e7e34, #28a745); border-left: 5px solid #155724;
        {% elif message.tags == 'warning' %}background: linear-gradient(135deg, #d39e00, #ffc107); color: #212529; border-left: 5px solid #856404;
        {% elif message.tags == 'error' %}background: linear-gradient(135deg, #bd2130, #dc3545); border-left: 5px solid #721c24;
        {% else %}background: linear-gradient(135deg, #117a8b, #17a2b8); border-left: 5px solid #0c5460;{% endif %}">
        <div style="display: flex; align-items: center; gap: 10px;">
            {% if message.tags == 'success' %}<span style="font-size: 1.15rem;">✅</span>
            {% elif message.tags == 'warning' %}<span style="font-size: 1.15rem;">⚠️</span>
            {% elif message.tags == 'error' %}<span style="font-size: 1.15rem;">❌</span>
            {% else %}<span style="font-size: 1.15rem;">ℹ️</span>{% endif %}
            <span>{{ message }}</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" style="background: none; border: none; color: inherit; font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 0 4px; opacity: 0.85;" title="Dismiss">&times;</button>
    </div>
    {% endfor %}
</div>
<style>
@keyframes toastSlideIn {
    from { transform: translateX(110%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
</style>
<script>
setTimeout(function() {
    var container = document.getElementById('toast-container');
    if (container) {
        container.style.transition = 'opacity 0.6s ease';
        container.style.opacity = '0';
        setTimeout(function() { container.remove(); }, 600);
    }
}, 4500);
</script>
{% endif %}
